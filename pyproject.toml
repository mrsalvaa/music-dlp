[project]
name = "music-dlp"
version = "0.1.0"
description = "Download playlists as tagged audio files from TXT lists, with Spotify playlist export built in"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = ["yt-dlp[default]", "PySide6-Essentials>=6.7", "keyring>=25", "secretstorage>=3.3"]

[project.optional-dependencies]
dev = ["pytest"]

[project.gui-scripts]
music-dlp = "music_dlp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/music_dlp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
