# SPDX-License-Identifier: GPL-3.0-or-later
# Corre los tests y construye el AppImage en Ubuntu 22.04 (glibc vieja = compatible con casi cualquier distro).
# Con una etiqueta vX.Y.Z publica el AppImage y su SHA256SUMS en la versión (release) de esa etiqueta.
# A mano (Run workflow) se le puede pasar una etiqueta existente para reconstruir y reemplazar sus archivos.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Etiqueta existente cuya versión hay que reconstruir (p. ej. v0.1.0). Vacío = solo construir."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ inputs.release }}
  cancel-in-progress: true

jobs:
  appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write   # solo para publicar la versión
    env:
      RELEASE_TAG: ${{ inputs.release || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release || github.ref }}

      - name: Dependencias del sistema (Qt sin pantalla y herramientas)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q binutils libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libwayland-client0 libwayland-cursor0 libwayland-egl1

      - uses: astral-sh/setup-uv@v5

      - name: Entorno y tests
        run: |
          uv venv -q --python 3.13 .venv
          uv pip install -q --python .venv/bin/python "yt-dlp[default]" PySide6-Essentials keyring secretstorage pytest
          .venv/bin/python -m pytest -q

      - name: La etiqueta coincide con la versión del código
        if: env.RELEASE_TAG != ''
        run: |
          version=$(.venv/bin/python -c "import sys; sys.path.insert(0,'src'); import music_dlp; print(music_dlp.__version__)")
          test "v$version" = "$RELEASE_TAG" || { echo "La etiqueta $RELEASE_TAG no coincide con la versión $version"; exit 1; }

      - name: appimagetool
        run: |
          mkdir -p build
          curl -fsSL -o build/appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x build/appimagetool-x86_64.AppImage

      - name: Construir el AppImage
        run: ./packaging/build-appimage.sh

      - name: Probar que arranca
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen MUSIC_DLP_CONFIG="$RUNNER_TEMP/cfg" MUSIC_DLP_DATA="$RUNNER_TEMP/data" \
            timeout 15 dist/music-dlp-*-x86_64.AppImage --appimage-extract-and-run
          code=$?
          echo "exit=$code"
          test "$code" -eq 124   # 124 = seguía abierta cuando la cortó timeout

      - name: Verificar la suma
        run: cd dist && sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: music-dlp-AppImage
          path: |
            dist/music-dlp-*-x86_64.AppImage
            dist/SHA256SUMS

      - name: Publicar versión
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # La versión ya existe (p. ej. se publicó con un AppImage local): reemplazar sus archivos
            gh release upload "$RELEASE_TAG" dist/music-dlp-*-x86_64.AppImage dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" dist/music-dlp-*-x86_64.AppImage dist/SHA256SUMS \
              --title "music-dlp $RELEASE_TAG" --generate-notes
          fi
